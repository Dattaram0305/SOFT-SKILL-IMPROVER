<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soft Skill Improver - DK</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height:100vh; padding:20px; }
        .container { max-width:1100px; margin:0 auto; }
        h1 { color:white; text-align:center; font-size:42px; margin:30px 0 10px; }
        .subtitle { color:#e0e0e0; text-align:center; margin-bottom:40px; font-size:18px; }
        .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:25px; }
        .card { background:white; border-radius:16px; padding:25px; box-shadow:0 10px 30px rgba(0,0,0,0.2); transition:0.3s; }
        .card:hover { transform: translateY(-8px); box-shadow:0 15px 40px rgba(0,0,0,0.3); }
        .icon { font-size:40px; margin-bottom:15px; }
        .card h3 { font-size:22px; margin-bottom:10px; color:#333; }
        .card p { color:#666; line-height:1.5; margin-bottom:20px; }
        .btn { display:inline-block; background:#667eea; color:white; padding:10px 22px; border-radius:25px; text-decoration:none; font-weight:600; }
        .btn:hover { background:#5a67d8; }
        footer { text-align:center; color:white; margin-top:50px; opacity:0.8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Soft Skill Improver</h1>
        <p class="subtitle">By DK - Daily Practice for Confidence & Communication</p>
        
        <div class="grid">
            {% for skill in skills %}
            <div class="card">
                <div class="icon">{{ skill.icon }}</div>
                <h3>{{ skill.title }}</h3>
                <p>{{ skill.desc }}</p>
                <a href="#" class="btn">Start Practice →</a>
            </div>
            {% endfor %}
        </div>

        <footer>
            <p>Made with ❤️ by DK | 2026</p>
        </footer>
    </div>
</body>
</html>
